<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>انقطع الاتصال — مجلسنا</title>
    <meta name="theme-color" content="#C84B31" />
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif;
        background-color: #faf8f4;
        color: #1c1917;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #141210;
          color: #f5f2eb;
        }
        .card {
          background-color: #1e1b18;
          border-color: #342e28;
        }
        .muted {
          color: #b8afa3;
        }
      }
      .card {
        width: 100%;
        max-width: 420px;
        background-color: #ffffff;
        border: 1px solid #e5dec9;
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 14px 40px -18px rgba(28, 25, 23, 0.16);
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 16px;
        display: block;
        border-radius: 18px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
        font-weight: 800;
      }
      .muted {
        margin: 0 0 22px;
        font-size: 0.94rem;
        line-height: 1.65;
        color: #57534e;
      }
      .btn {
        width: 100%;
        height: 48px;
        border: none;
        border-radius: 14px;
        background-color: #c84b31;
        color: #ffffff;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
      }
      .btn:hover {
        background-color: #b03e26;
      }
      .en-note {
        margin-top: 16px;
        font-size: 0.8rem;
        opacity: 0.72;
        direction: ltr;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="logo" viewBox="0 0 72 72" fill="none" aria-hidden="true">
        <rect width="72" height="72" rx="18" fill="#FAF8F4" stroke="#E5DEC9" />
        <path
          d="M22 39C22 33.477 26.477 29 32 29H40C45.523 29 50 33.477 50 39V44C50 46.209 48.209 48 46 48C44.4 48 43 47 42.2 45.6L40.8 43H31.2L29.8 45.6C29 47 27.6 48 26 48C23.791 48 22 46.209 22 44V39Z"
          fill="#EAE6DE"
          stroke="#1C1917"
          stroke-width="2"
        />
        <path d="M27.5 38.5H31.5M29.5 36.5V40.5" stroke="#1C1917" stroke-width="2" stroke-linecap="round" />
        <circle cx="42" cy="36.5" r="1.5" fill="#2B4C7E" />
        <circle cx="44.5" cy="39" r="1.5" fill="#2D6A4F" />
        <circle cx="39.5" cy="39" r="1.5" fill="#D97706" />
        <circle cx="42" cy="41.5" r="1.5" fill="#C84B31" />
        <path d="M18 18L54 54" stroke="#C84B31" stroke-width="3" stroke-linecap="round" />
      </svg>
      <h1>أنت غير متصل بالإنترنت</h1>
      <p class="muted">
        يبدو أن الاتصال بالإنترنت قد انقطع مؤقتاً. تأكد من الشبكة ثم أعد المحاولة للعودة إلى مجلسنا واللعب مع أصدقائك.
      </p>
      <button type="button" class="btn" onclick="window.location.reload()">إعادة المحاولة</button>
      <p class="en-note">You are currently offline. Reconnect and tap to retry.</p>
    </main>
  </body>
</html>
